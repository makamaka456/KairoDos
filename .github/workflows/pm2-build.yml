name: PM2 mod APK

# 개조(PM2) 빌드: 디버그 키로 서명한 APK를 만들어 Actions 결과물(artifact)로 남긴다.
# Actions 탭 → "PM2 mod APK" → "Run workflow" 로 실행. 끝나면 실행 화면 아래 Artifacts 에서 받는다.
on:
  workflow_dispatch:
  push:
    branches: [pm2-mod]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned Kairo frontend
        run: git submodule update --init --recursive shared
      # 개조(PM2): 원작자 저장소인 shared 를 직접 고칠 수 없어, 고칠 내용은 pm2-patches 에 패치로 두고 빌드 때 적용한다.
      - name: Apply the PM2 mod's patches to the Kairo frontend
        shell: bash
        run: for p in pm2-patches/shared-*.patch; do git -C shared apply --verbose "../$p"; done
      - id: android
        uses: ./shared/.github/actions/setup-android
      # 에뮬레이터 부품(SDL 등)을 저장소 안 소스로 먼저 짓는다(README "Building from source", tools/checks.sh).
      - name: Prepare the DOSBox Staging dependencies
        shell: pwsh
        run: ./tools/PrepareStagingDependencies.ps1
      - name: Build the APK
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon :kairodos:assembleWithoutImagesDebug 2>&1 | tee build.log; then
            {
              echo '## Build errors'
              echo '```'
              grep -n -E '^e: |error:|What went wrong|FAILURE|Exception|> ' build.log | head -n 80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # 개조(PM2): 빌드마다 바뀌는 디버그 키 대신, 저장소 Secret 의 고정 키로 다시 서명한다.
      # 그래서 어느 빌드의 APK든 이전 버전 위에 덮어 설치된다. Secret 이 없으면 빌드를 실패시킨다.
      - name: Sign the APK with the fixed PM2 key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PM2_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PM2_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PM2_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "PM2_KEYSTORE_BASE64 / PM2_KEYSTORE_PASSWORD / PM2_KEY_ALIAS secrets are missing"; exit 1
          fi
          ks="$RUNNER_TEMP/pm2-release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
          apksigner="$ANDROID_HOME/build-tools/${{ steps.android.outputs.build-tools }}/apksigner"
          for apk in kairodos/build/outputs/apk/withoutImages/debug/*.apk; do
            "$apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD "$apk"
            "$apksigner" verify --print-certs "$apk" | grep -i 'SHA-256'
          done
          rm -f "$ks"
      - uses: actions/upload-artifact@v4
        with:
          name: pm2-kairodos-apk
          path: kairodos/build/outputs/apk/withoutImages/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      # 로그인 없이 받을 수 있게 공개 릴리즈 "pm2-latest"에도 올린다(게임 파일은 들어 있지 않다).
      # 위 단계에서 고정 키로 서명했으므로 받은 그대로 덮어 설치할 수 있다.
      - name: Publish the APK to the pm2-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls kairodos/build/outputs/apk/withoutImages/debug/*.apk | head -n 1)
          cp "$apk" pm2-latest.apk
          gh release view pm2-latest >/dev/null 2>&1 || gh release create pm2-latest --prerelease \
            --target "$GITHUB_SHA" --title "PM2 mod latest build" --notes "pm2-mod 가지의 최신 빌드(Actions가 자동으로 바꾼다)."
          gh release upload pm2-latest pm2-latest.apk --clobber
          gh release edit pm2-latest --notes "pm2-mod 가지의 최신 빌드: ${GITHUB_SHA::7} (Actions가 자동으로 바꾼다)."
      # 개조(PM2): kairodos/build.gradle.kts 의 versionName 마다 정식 릴리즈 "pm2-v<버전>"을 한 번 만든다.
      # 이미 그 버전의 APK가 올라가 있으면 건드리지 않으니, 새 릴리즈를 내려면 versionName(과 versionCode)을 올린다.
      - name: Publish the APK to the pm2-v<version> release
        if: github.ref == 'refs/heads/pm2-mod'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^android\.defaultConfig\.versionName = "\(.*\)"$/\1/p' kairodos/build.gradle.kts)
          if [ -z "$version" ]; then echo "versionName not found"; exit 1; fi
          tag="pm2-v$version"
          asset="PM2Launcher-$version.apk"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --latest \
              --title "프린세스 메이커 2 런처 v$version" \
              --notes "프린세스 메이커 2 전용 런처(KairoDos 개조판) v$version. 아래 $asset 을 받아 설치한다(게임 파일은 들어 있지 않다)."
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
            echo "$tag already has $asset"
          else
            cp pm2-latest.apk "$asset"
            gh release upload "$tag" "$asset"
          fi
